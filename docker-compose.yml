services:
  laravel:
    build:
      context: ./laravel-api
      dockerfile: Dockerfile
      target: production
    container_name: laravel
    restart: unless-stopped
    volumes:
      - laravel_code:/var/www          # ← Laravel peuple ce volume
    depends_on:
      - postgres
      - redis
    networks:
      - laravel_network

  nginx:
    image: nginx:1.29-alpine
    container_name: nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - laravel_code:/var/www          # ← Nginx lit depuis le même volume
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - laravel
    networks:
      - laravel_network

  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - laravel_network

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    networks:
      - laravel_network

  node:
    image: node:22-alpine
    working_dir: /var/www
    volumes:
      - ./laravel-api:/var/www         # ← node garde le bind mount (dev only)
    ports:
      - "5173:5173"
    restart: unless-stopped
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    networks:
      - laravel_network

volumes:
  postgres_data:
  laravel_code:                        # ← volume nommé partagé
networks:
  laravel_network: