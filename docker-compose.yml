services:
  laravel:
    build:
      context: ./laravel-api
      dockerfile: Dockerfile

    container_name: laravel

    restart: unless-stopped

    working_dir: /var/www

    volumes:
      - ./laravel-api:/var/www

    depends_on:
      - postgres
      - redis

    networks:
      - laravel_network

  nginx:
    image: nginx:1.29-alpine

    container_name: nginx

    restart: unless-stopped

    ports:
      - "8000:80"

    volumes:
      - ./laravel-api:/var/www
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf

    depends_on:
      - laravel

    networks:
      - laravel_network

  postgres:
    image: postgres:16-alpine

    container_name: postgres

    restart: unless-stopped

    environment:
      POSTGRES_DB: laravel_docker_k8s
      POSTGRES_USER: db_manager
      POSTGRES_PASSWORD: dev@dev

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql

    networks:
      - laravel_network

  redis:
    image: redis:7-alpine

    container_name: redis

    restart: unless-stopped

    networks:
      - laravel_network

volumes:
  postgres_data:

networks:
  laravel_network:
