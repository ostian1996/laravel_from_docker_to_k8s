name: Build & Push — Staging

on:
  push:
    branches:
      - develop

env:
  PHP_VERSION: '8.3'
  REGISTRY_GHCR: ghcr.io
  REGISTRY_DOCKERHUB: docker.io
  IMAGE_NAME: ${{ github.repository }}

jobs:

  ci:
    name: Lint & Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: laravel_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo, pdo_pgsql, redis, zip
          coverage: none

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ runner.os }}-${{ hashFiles('laravel-api/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Installation des dépendances
        working-directory: laravel-api
        run: composer install --no-interaction --prefer-dist --no-scripts

      - name: Préparation environnement
        working-directory: laravel-api
        run: |
          cp .env.example .env
          php artisan key:generate
          sed -i 's/DB_HOST=.*/DB_HOST=127.0.0.1/' .env
          sed -i 's/DB_DATABASE=.*/DB_DATABASE=laravel_test/' .env
          sed -i 's/DB_USERNAME=.*/DB_USERNAME=test_user/' .env
          sed -i 's/DB_PASSWORD=.*/DB_PASSWORD=test_password/' .env

      - name: Migrations
        working-directory: laravel-api
        run: php artisan migrate --force

      - name: Tests
        working-directory: laravel-api
        run: php artisan test --parallel

  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: ci

    permissions:
      contents: read
      packages: write

    env:
      GHCR_IMAGE: ghcr.io/${{ github.repository }}
      DOCKERHUB_IMAGE: ostianstephane96/laravel_from_docker_to_k8s

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Build image
        run: |
          docker build \
            --tag ${{ env.GHCR_IMAGE }}:develop \
            --tag ${{ env.GHCR_IMAGE }}:develop-${{ github.sha }} \
            --tag ${{ env.DOCKERHUB_IMAGE }}:develop \
            --tag ${{ env.DOCKERHUB_IMAGE }}:develop-${{ github.sha }} \
            -f ./laravel-api/docker/Dockerfile.dev \
            ./laravel-api

      - name: Push to GHCR
        run: |
          docker push ${{ env.GHCR_IMAGE }}:develop
          docker push ${{ env.GHCR_IMAGE }}:develop-${{ github.sha }}

      - name: Push to Docker Hub
        run: |
          docker push ${{ env.DOCKERHUB_IMAGE }}:develop
          docker push ${{ env.DOCKERHUB_IMAGE }}:develop-${{ github.sha }}

      - name: Résumé
        run: |
          echo "## Images publiées 🐳" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ env.GHCR_IMAGE }}:develop\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ env.GHCR_IMAGE }}:develop-${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ env.DOCKERHUB_IMAGE }}:develop\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ env.DOCKERHUB_IMAGE }}:develop-${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY