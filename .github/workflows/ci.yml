name: CI — Lint & Tests

on:
  push:
    branches:
      - 'feat/**'
      - 'fix/**'
  pull_request:
    branches:
      - develop

env:
  PHP_VERSION: '8.3'

jobs:

  lint:
    name: PHP Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo, pdo_pgsql, redis, zip
          coverage: none

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ runner.os }}-${{ hashFiles('laravel-api/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Installation des dépendances
        working-directory: laravel-api
        run: composer install --no-interaction --prefer-dist --optimize-autoloader --no-scripts

      - name: Vérification syntaxe PHP
        working-directory: laravel-api
        run: |
          find . -name "*.php" \
            -not -path "./vendor/*" \
            -not -path "./storage/*" \
            -exec php -l {} \; | grep -v "No syntax errors" || true

  tests:
    name: PHPUnit Tests
    runs-on: ubuntu-latest
    needs: lint

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: laravel_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo, pdo_pgsql, redis, zip
          coverage: none

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ runner.os }}-${{ hashFiles('laravel-api/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Installation des dépendances
        working-directory: laravel-api
        run: composer install --no-interaction --prefer-dist --no-scripts

      - name: Préparation environnement
        working-directory: laravel-api
        run: |
          cp .env.example .env
          php artisan key:generate
          sed -i 's/DB_HOST=.*/DB_HOST=127.0.0.1/' .env
          sed -i 's/DB_DATABASE=.*/DB_DATABASE=laravel_test/' .env
          sed -i 's/DB_USERNAME=.*/DB_USERNAME=test_user/' .env
          sed -i 's/DB_PASSWORD=.*/DB_PASSWORD=test_password/' .env

      - name: Migrations
        working-directory: laravel-api
        run: php artisan migrate --force

      - name: Tests
        working-directory: laravel-api
        run: php artisan test --parallel